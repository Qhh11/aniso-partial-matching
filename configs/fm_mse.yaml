# Portable example configuration, not a claim of historical checkpoint parity.
objective: fm_mse
seed: 1234
fm_regularization: 0.001
operators:
  kind: aniso
  k_eig: 128
  normalization: max_radius
  boundary:
    beta_tangent: 2.0
    gamma_normal: 2.0
    sigmoid_center_frac: 0.06
    sigmoid_width_frac: 0.02
    normalize_tensor: trace
    distance_method: fast_marching
    direction_method: backtrack
  transfer:
    source: gt
    fallback_mode: none
    seg_tau: 0.5
model:
  backbone: diffusionnet
  input: xyz
  channels: 128
  width: 128
  blocks: 4
  dropout: true
  gradient: full
  fmap_k: 30
training:
  epochs: 10
  lr: 0.001
  scheduler_period: 300
  min_lr: 0.0001
